name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build tag version'
        required: false
        default: 'latest'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/custom-release'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.19

      - name: Test
        run: go test -cover ./...

  build-linux:
    name: Build Linux Images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      max-parallel: 2
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            file: docker/Dockerfile.linux.amd64
          - arch: arm64
            file: docker/Dockerfile.linux.arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: v0.9.1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ecmchow/drone-gitea-release:linux-${{ matrix.arch }}

  publish-manfiest:
    name: Publish Manifest
    runs-on: ubuntu-latest
    needs:
      - build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Manifest
        run: |
          docker manifest create ecmchow/drone-gitea-release:latest \
            --amend ecmchow/drone-gitea-release:linux-amd64 \
            --amend ecmchow/drone-gitea-release:linux-arm64
    
      - name: Docker Annotate
        run: |
          docker manifest annotate --os linux --arch amd64 \
            ecmchow/drone-gitea-release:latest ecmchow/drone-gitea-release:linux-amd64
         
          docker manifest annotate --os linux --arch arm64 \
            ecmchow/drone-gitea-release:latest ecmchow/drone-gitea-release:linux-arm64
    
      - name: Docker Push
        run: |
          docker manifest push ecmchow/drone-gitea-release:latest

      - name: Docker Manifest (Custom Tag)
        if: github.event.inputs.tag != 'latest'
        run: |
          docker manifest create ecmchow/drone-gitea-release:${{ github.event.inputs.tag }} \
            --amend ecmchow/drone-gitea-release:linux-amd64 \
            --amend ecmchow/drone-gitea-release:linux-arm64

      - name: Docker Annotate (Custom Tag)
        if: github.event.inputs.tag != 'latest'
        run: |
          docker manifest annotate --os linux --arch amd64 \
            ecmchow/drone-gitea-release:${{ github.event.inputs.tag }} ecmchow/drone-gitea-release:linux-amd64
         
          docker manifest annotate --os linux --arch arm64 \
            ecmchow/drone-gitea-release:${{ github.event.inputs.tag }} ecmchow/drone-gitea-release:linux-arm64
    
      - name: Docker Push (Custom Tag)
        if: github.event.inputs.tag != 'latest'
        run: |
          docker manifest push ecmchow/drone-gitea-release:${{ github.event.inputs.tag }}
